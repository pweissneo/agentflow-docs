site_name: Agentflow
site_description: Autonomous software development agents powered by AI CLI tools
docs_dir: docs-site

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Setup Guides:
      - Docker Compose: setup/docker.md
      - Kubernetes: setup/kubernetes.md
      - Custom Agent Images: setup/custom-images.md
      - Local (Development): setup/local.md
  - Authentication: authentication.md
  - Configuration: configuration.md
  - How It Works:
      - Overview: how-it-works/overview.md
      - Workflow States: how-it-works/workflow-states.md
      - Agents: how-it-works/agents.md
  - Customization:
      - AI Providers: customization/providers.md
      - Project-Specific Prompts: customization/project-prompts.md
      - Application Secrets: customization/application-secrets.md
      - Review Policies: customization/policies.md
      - Notifications: customization/notifications.md
  - Troubleshooting: troubleshooting.md
